name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule : une action compromise ne doit pas pouvoir écrire ici.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Le cœur de calcul n'importe aucune dépendance tierce : le scraping est
      # ailleurs. Les tests tournent donc sans installer ni navigateur ni
      # bibliothèque HTTP, en quelques centièmes de seconde.
      - name: Installer pytest
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: pytest tests -q
